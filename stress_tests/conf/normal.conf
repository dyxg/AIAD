# Locust config: normal 级别（50 用户 / 5 分钟，常规压测）
# 假设 LLM/Chroma 已就绪，模拟典型工作负载
# 用法：locust -f stress_tests/locustfile.py --config stress_tests/conf/normal.conf
locustfile = stress_tests/locustfile.py
host = http://localhost:8000
users = 50
spawn-rate = 5
run-time = 5m
headless = true
only-summary = false
csv = stress_tests/.reports/normal
html = stress_tests/.reports/normal.html
