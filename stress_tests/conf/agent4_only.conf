# Locust config: 只压 Agent 4（RAG 检索），不依赖 LLM
# 用法：locust -f stress_tests/locustfile.py --config stress_tests/conf/agent4_only.conf
locustfile = stress_tests/locustfile.py
host = http://localhost:8000
users = 30
spawn-rate = 3
run-time = 3m
headless = true
only-summary = false
tags = agent4
csv = stress_tests/.reports/agent4
html = stress_tests/.reports/agent4.html
