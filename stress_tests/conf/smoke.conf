# Locust config: smoke 级别（本地启动后快速验证 5 用户/30s）
# 用法：locust -f stress_tests/locustfile.py --config stress_tests/conf/smoke.conf
locustfile = stress_tests/locustfile.py
host = http://localhost:8000
users = 5
spawn-rate = 1
run-time = 30s
headless = true
only-summary = false
csv = stress_tests/.reports/smoke
html = stress_tests/.reports/smoke.html
# 默认跳过 LLM/heavy/SSE，降低本地依赖
exclude-tags = llm,heavy,sse
