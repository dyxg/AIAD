# Locust config: peak 级别（200 用户 / 15 分钟，峰值压测）
# 期望后端有完整资源（DB/LLM/网络），用来摸顶
# 用法：locust -f stress_tests/locustfile.py --config stress_tests/conf/peak.conf
locustfile = stress_tests/locustfile.py
host = http://localhost:8000
users = 200
spawn-rate = 10
run-time = 15m
headless = true
only-summary = false
csv = stress_tests/.reports/peak
html = stress_tests/.reports/peak.html
